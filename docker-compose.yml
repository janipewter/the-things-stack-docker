version: '2'

volumes:
  redis:
  postgres:
  stack-blob:
  stack-data:
  letsencrypt:

services:

  postgres:
    image: postgres:14.3-alpine3.15
    container_name: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=root
      - POSTGRES_USER=root
      - POSTGRES_DB=ttn_lorawan
    volumes:
      - 'postgres:/var/lib/postgresql/data'
    ports:
      - "127.0.0.1:5432:5432"
    
  redis:
    image: redis:7.0.0-alpine3.15
    container_name: redis
    command: redis-server --appendonly yes
    restart: unless-stopped
    volumes:
      - 'redis:/data'
    ports:
      - "127.0.0.1:6379:6379"
  
  certbot:
    build:
      context: .
      dockerfile: Dockerfile.certbot
    container_name: certbot
    restart: unless-stopped
    volumes:
      - 'stack-data:/srv/data'
      - 'letsencrypt:/etc/letsencrypt'
    environment:
      # Left empty so a balena fleet/device variable of the same name is used.
      # A value set here would take precedence over it.
      TTS_DOMAIN: ''
      # Set CF_API_TOKEN and TTS_ACME_EMAIL to enable publicly-trusted
      # certificates. Without them the stack falls back to self-signed ones.
      CF_API_TOKEN: ''
      TTS_ACME_EMAIL: ''
      # Set to "true" while testing to avoid the Let's Encrypt rate limits
      TTS_ACME_STAGING: 'false'

  stack:
    image: xoseperez/the-things-stack:latest
    #build:
    #  context: .
    #  dockerfile: Dockerfile
    #  args:
    #    ARCH: amd64
    #    REMOTE_TAG: 3.34.3
    container_name: stack
    restart: unless-stopped
    depends_on:
      - redis
      - postgres
      - certbot
    volumes:
      - 'stack-blob:/srv/ttn-lorawan/public/blob'
      - 'stack-data:/srv/data'
    environment:
      # Left empty so a balena fleet/device variable of the same name is used.
      # A value set here would take precedence over it. On balena, an unset
      # TTS_DOMAIN falls back to the device LAN IP, which works for
      # self-signed certificates but not for ACME.
      TTS_DOMAIN: ''
      CF_API_TOKEN: ''
      TTS_ACME_EMAIL: ''
      TTN_LW_BLOB_LOCAL_DIRECTORY: /srv/ttn-lorawan/public/blob
      TTN_LW_REDIS_ADDRESS: redis:6379
      TTN_LW_IS_DATABASE_URI: postgres://root:root@postgres:5432/ttn_lorawan?sslmode=disable
      CLI_AUTO_LOGIN: "false"
    labels:
      io.balena.features.balena-api: '1'

    #secrets:
    #  - ca.pem
    #  - cert.pem
    #  - key.pem

    ports:
    
      - "80:1885"
      - "443:8885"
    
      - "1881:1881"
      - "1882:1882"
      - "1883:1883"
      - "1884:1884"
      - "1885:1885"
      - "1887:1887"
      
      - "8881:8881"
      - "8882:8882"
      - "8883:8883"
      - "8884:8884"
      - "8885:8885"
      - "8887:8887"
      
      - "1700:1700/udp"

